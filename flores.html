<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi gogda 💛 | Flores Amarillas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a1a 50%, #000 100%);
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Estrellas de fondo */
    .estrella {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Título principal */
    .titulo {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ffaa00;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .titulo h1 {
      font-size: 2.4rem;
      color: #ffd700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .titulo p {
      font-size: 1.3rem;
      color: #ffe566;
      opacity: 0.95;
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px #ffd700, 0 0 30px #ffaa00; }
      to { text-shadow: 0 0 25px #ffd700, 0 0 50px #ffaa00, 0 0 70px #ff8800; }
    }

    /* Centro (sol / planeta) */
    .centro {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff9c4, #ffeb3b 40%, #ffc107 70%, #ff8f00);
      box-shadow: 
        0 0 40px #ffd700,
        0 0 80px #ffaa00,
        0 0 120px #ff8800,
        inset 0 0 30px rgba(255,255,255,0.4);
      z-index: 5;
      animation: pulse 4s ease-in-out infinite;
    }

    .centro::after {
      content: '';
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      border: 3px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Contenedor de flores y mensajes */
    .orbita {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Flores */
    .flor {
      position: absolute;
      font-size: 28px;
      filter: drop-shadow(0 0 8px #ffd700);
      animation: flotar 8s ease-in-out infinite;
      user-select: none;
      z-index: 10;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }

    /* Mensajes */
    .mensaje {
      position: absolute;
      font-size: 0.95rem;
      color: #ffe566;
      text-shadow: 0 0 10px #ffd700;
      white-space: nowrap;
      z-index: 15;
      opacity: 0.9;
      animation: aparecer 1.5s ease-out forwards;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 0.95; transform: scale(1); }
    }

    /* Texto especial */
    .especial {
      font-size: 1.1rem;
      color: #fff;
      font-weight: 600;
      text-shadow: 0 0 12px #ffd700, 0 0 25px #ffaa00;
    }
  </style>
</head>
<body>

  <!-- Título -->
  <div class="titulo">
    <h1>Mi gogda 💛</h1>
    <p>Feliz día Amor🌻</p>
  </div>

  <!-- Centro brillante -->
  <div class="centro"></div>

  <!-- Contenedor de órbitas -->
  <div class="orbita" id="orbita"></div>

  <script>
    // Crear estrellas de fondo
    function crearEstrellas() {
      for (let i = 0; i < 180; i++) {
        const estrella = document.createElement('div');
        estrella.classList.add('estrella');
        const size = Math.random() * 2.5 + 0.5;
        estrella.style.width = size + 'px';
        estrella.style.height = size + 'px';
        estrella.style.left = Math.random() * 100 + 'vw';
        estrella.style.top = Math.random() * 100 + 'vh';
        estrella.style.animationDelay = Math.random() * 4 + 's';
        estrella.style.opacity = Math.random() * 0.8 + 0.2;
        document.body.appendChild(estrella);
      }
    }

    // Mensajes bonitos
    const mensajes = [
      "Flores para ti 🌻",
      "Sonríe siempre",
      "Siempre brillas",
      "Eres mi luz ✨",
      "Te elijo todos los días",
      "Mi persona favorita",
      "Gracias por existir",
      "Contigo todo es mejor",
      "Mi gogda hermosa",
      "Amor eterno 💛",
      "Brillas más que el sol",
      "Eres mi paz"
    ];

    // Crear flores y mensajes alrededor del centro
    function crearElementos() {
      const orbita = document.getElementById('orbita');
      const total = 18;

      for (let i = 0; i < total; i++) {
        const angulo = (i / total) * Math.PI * 2;
        const radio = 180 + Math.random() * 140; // Distancia del centro
        const x = Math.cos(angulo) * radio;
        const y = Math.sin(angulo) * radio;

        // Flor
        const flor = document.createElement('div');
        flor.classList.add('flor');
        flor.textContent = '🌻';
        flor.style.left = `calc(50% + ${x}px)`;
        flor.style.top = `calc(50% + ${y}px)`;
        flor.style.animationDelay = (Math.random() * 3) + 's';
        flor.style.fontSize = (22 + Math.random() * 16) + 'px';
        orbita.appendChild(flor);

        // Mensaje cerca de algunas flores
        if (i % 2 === 0) {
          const msg = document.createElement('div');
          msg.classList.add('mensaje');
          if (i === 0 || i === 6) msg.classList.add('especial');
          msg.textContent = mensajes[i % mensajes.length];
          msg.style.left = `calc(50% + ${x * 1.15}px)`;
          msg.style.top = `calc(50% + ${y * 1.15}px)`;
          msg.style.animationDelay = (0.3 + Math.random()) + 's';
          orbita.appendChild(msg);
        }
      }
    }

    // Inicializar
    crearEstrellas();
    crearElementos();

    // Opcional: que las flores giren lentamente alrededor del centro
    let rotacion = 0;
    function girar() {
      rotacion += 0.08;
      document.getElementById('orbita').style.transform = `rotate(${rotacion}deg)`;
      requestAnimationFrame(girar);
    }
    // Descomenta la siguiente línea si quieres que gire todo el sistema:
    // girar();
  </script>
</body>
</html>
