<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi gogda 💛 | Galaxia de Flores</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: radial-gradient(ellipse at center, #1b0b2e 0%, #0b0b1a 45%, #000 100%);
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px; /* Para efectos 3D */
    }

    /* ========== ESTRELLAS ========== */
    .estrella {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duracion) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.15; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }

    /* ========== TÍTULO ========== */
    .titulo {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 30;
      animation: titleEntrance 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .titulo h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      color: #ffd700;
      letter-spacing: 2px;
      text-shadow: 
        0 0 10px #ffd700,
        0 0 30px #ffaa00,
        0 0 60px #ff8800;
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    .titulo p {
      font-size: 1.15rem;
      color: #ffe566;
      margin-top: 6px;
      opacity: 0.9;
      text-shadow: 0 0 12px #ffd700;
    }

    @keyframes titleEntrance {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-40px) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    @keyframes glowPulse {
      from {
        text-shadow: 0 0 10px #ffd700, 0 0 25px #ffaa00;
      }
      to {
        text-shadow: 0 0 20px #ffd700, 0 0 50px #ffaa00, 0 0 80px #ff6600;
      }
    }

    /* ========== CENTRO (SOL) ========== */
    .centro {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fffde7, #ffeb3b 35%, #ffc107 65%, #ff8f00);
      box-shadow: 
        0 0 40px #ffd700,
        0 0 90px #ffaa00,
        0 0 140px rgba(255, 140, 0, 0.6),
        inset 0 0 40px rgba(255,255,255,0.35);
      z-index: 10;
      animation: solPulse 5s ease-in-out infinite, solRotate 40s linear infinite;
    }

    .centro::before {
      content: '';
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      border: 2px solid rgba(255, 215, 0, 0.25);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
      animation: anillo 6s ease-in-out infinite;
    }

    .centro::after {
      content: '';
      position: absolute;
      inset: -55px;
      border-radius: 50%;
      border: 1px solid rgba(255, 215, 0, 0.12);
      animation: anillo 8s ease-in-out infinite reverse;
    }

    @keyframes solPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes solRotate {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(15deg); }
    }

    @keyframes anillo {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* ========== SISTEMA DE ÓRBITAS ========== */
    .sistema {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
    }

    /* Cada elemento orbita */
    .elemento {
      position: absolute;
      transform-style: preserve-3d;
    }

    .flor {
      font-size: 28px;
      filter: drop-shadow(0 0 10px #ffd700);
      animation: flotar 6s ease-in-out infinite;
      user-select: none;
      cursor: default;
      transition: transform 0.3s ease;
    }

    .flor:hover {
      transform: scale(1.4) !important;
      filter: drop-shadow(0 0 18px #ffd700);
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-12px) rotate(6deg) scale(1.05); }
      50% { transform: translateY(-4px) rotate(-4deg) scale(0.98); }
      75% { transform: translateY(-18px) rotate(8deg) scale(1.08); }
    }

    /* Mensajes */
    .mensaje {
      position: absolute;
      font-size: 0.92rem;
      color: #ffe566;
      text-shadow: 0 0 12px #ffd700, 0 0 20px rgba(255, 200, 0, 0.5);
      white-space: nowrap;
      opacity: 0;
      animation: mensajeEntrada 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
    }

    .mensaje.especial {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 0 15px #ffd700, 0 0 30px #ffaa00;
    }

    @keyframes mensajeEntrada {
      from {
        opacity: 0;
        transform: scale(0.4) translateY(20px);
      }
      to {
        opacity: 0.95;
        transform: scale(1) translateY(0);
      }
    }

    /* Partículas pequeñas (polvo estelar) */
    .particula {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffd700;
      animation: particulaMove 12s linear infinite;
      opacity: 0.7;
    }

    @keyframes particulaMove {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      90% { opacity: 0.6; }
      100% {
        transform: translateY(-100vh) scale(0.3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Título -->
  <div class="titulo">
    <h1>Mi gogda 💛</h1>
    <p>Feliz día de las Flores Amarillas 🌻</p>
  </div>

  <!-- Sol central -->
  <div class="centro"></div>

  <!-- Sistema de órbitas -->
  <div class="sistema" id="sistema"></div>

  <script>
    // ========== ESTRELLAS ==========
    function crearEstrellas() {
      for (let i = 0; i < 200; i++) {
        const estrella = document.createElement('div');
        estrella.classList.add('estrella');
        const size = Math.random() * 2.8 + 0.4;
        estrella.style.width = size + 'px';
        estrella.style.height = size + 'px';
        estrella.style.left = Math.random() * 100 + 'vw';
        estrella.style.top = Math.random() * 100 + 'vh';
        estrella.style.setProperty('--duracion', (2 + Math.random() * 4) + 's');
        estrella.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(estrella);
      }
    }

    // ========== MENSAJES ==========
    const mensajes = [
      { texto: "Flores para ti 🌻", especial: true },
      { texto: "Sonríe siempre", especial: false },
      { texto: "Siempre brillas", especial: false },
      { texto: "Eres mi luz ✨", especial: true },
      { texto: "Te elijo cada día", especial: false },
      { texto: "Mi persona favorita", especial: true },
      { texto: "Gracias por existir", especial: false },
      { texto: "Contigo todo es mejor", especial: false },
      { texto: "Mi gogda hermosa", especial: true },
      { texto: "Amor eterno 💛", especial: true },
      { texto: "Brillas más que el sol", especial: false },
      { texto: "Eres mi paz", especial: false },
      { texto: "Mi lugar seguro", especial: false },
      { texto: "Te adoro", especial: true }
    ];

    // ========== CREAR ELEMENTOS EN ÓRBITA ==========
    function crearSistema() {
      const sistema = document.getElementById('sistema');
      const totalFlores = 16;

      for (let i = 0; i < totalFlores; i++) {
        const angulo = (i / totalFlores) * Math.PI * 2;
        const radio = 170 + (i % 3) * 55 + Math.random() * 30;
        const x = Math.cos(angulo) * radio;
        const y = Math.sin(angulo) * radio;

        // Contenedor del elemento (para poder rotarlo)
        const elemento = document.createElement('div');
        elemento.classList.add('elemento');
        elemento.style.left = `calc(50% + ${x}px)`;
        elemento.style.top = `calc(50% + ${y}px)`;
        elemento.style.transform = `translate(-50%, -50%)`;

        // Flor
        const flor = document.createElement('div');
        flor.classList.add('flor');
        flor.textContent = '🌻';
        flor.style.fontSize = (22 + Math.random() * 18) + 'px';
        flor.style.animationDelay = (Math.random() * 4) + 's';
        flor.style.animationDuration = (5 + Math.random() * 4) + 's';
        elemento.appendChild(flor);

        // Mensaje (solo en algunas)
        if (i % 2 === 0 && mensajes[i % mensajes.length]) {
          const msg = document.createElement('div');
          msg.classList.add('mensaje');
          if (mensajes[i % mensajes.length].especial) {
            msg.classList.add('especial');
          }
          msg.textContent = mensajes[i % mensajes.length].texto;
          msg.style.animationDelay = (0.4 + i * 0.12) + 's';
          
          // Posicionar el mensaje un poco más afuera
          const offsetX = x * 0.22;
          const offsetY = y * 0.22;
          msg.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
          
          elemento.appendChild(msg);
        }

        sistema.appendChild(elemento);
      }
    }

    // ========== PARTÍCULAS ==========
    function crearParticulas() {
      setInterval(() => {
        const particula = document.createElement('div');
        particula.classList.add('particula');
        particula.style.left = Math.random() * 100 + 'vw';
        particula.style.bottom = '-10px';
        particula.style.animationDuration = (8 + Math.random() * 10) + 's';
        document.body.appendChild(particula);

        setTimeout(() => particula.remove(), 18000);
      }, 400);
    }

    // ========== ROTACIÓN LENTA DEL SISTEMA ==========
    let rotacion = 0;
    function girarSistema() {
      rotacion += 0.04;
      document.getElementById('sistema').style.transform = `rotate(${rotacion}deg)`;
      requestAnimationFrame(girarSistema);
    }

    // Inicializar todo
    crearEstrellas();
    crearSistema();
    crearParticulas();
    //girarSistema(); // ← Comenta esta línea si no quieres que gire
  </script>
</body>
</html>
