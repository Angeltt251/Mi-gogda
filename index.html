<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi gogda 💛</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100dvh;
      background: #03010a;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      user-select: none;
    }

    .nebulosa {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 15%, rgba(140, 50, 200, 0.18) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 70%, rgba(50, 90, 200, 0.15) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 40%, rgba(200, 100, 40, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse at center, #0c0618 0%, #03010a 75%);
      z-index: 0;
      pointer-events: none;
    }

    .estrella {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duracion) ease-in-out infinite alternate;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes twinkle {
      0% { opacity: 0.12; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.4); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }

    .titulo {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 50;
      width: 92%;
      pointer-events: none;
    }

    .titulo h1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.4rem, 9vw, 3.6rem);
      color: #ffe566;
      text-shadow: 
        0 0 15px rgba(255, 215, 0, 0.8),
        0 0 40px rgba(255, 180, 0, 0.5),
        0 0 70px rgba(255, 140, 0, 0.3);
      animation: titleGlow 4s ease-in-out infinite alternate;
    }

    .titulo p {
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      color: #ffec8b;
      margin-top: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    @keyframes titleGlow {
      from { text-shadow: 0 0 12px rgba(255,215,0,0.7), 0 0 30px rgba(255,180,0,0.4); }
      to { text-shadow: 0 0 22px rgba(255,215,0,0.95), 0 0 55px rgba(255,180,0,0.6), 0 0 90px rgba(255,140,0,0.35); }
    }

    .nucleo {
      position: absolute;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, 
        #fffef0 0%, 
        #fff59d 18%, 
        #ffeb3b 38%, 
        #ffc107 58%, 
        #ff9800 78%, 
        #e65100 100%);
      box-shadow: 
        0 0 30px #ffd700,
        0 0 70px rgba(255, 180, 0, 0.7),
        0 0 120px rgba(255, 140, 0, 0.45),
        0 0 180px rgba(255, 100, 0, 0.2),
        inset 0 0 40px rgba(255,255,255,0.45);
      z-index: 20;
      animation: nucleoPulse 7s ease-in-out infinite;
      pointer-events: none;
    }

    .nucleo::before {
      content: '';
      position: absolute;
      inset: -32px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 215, 0, 0.22);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
      animation: anillo 8s ease-in-out infinite;
    }

    .nucleo::after {
      content: '';
      position: absolute;
      inset: -58px;
      border-radius: 50%;
      border: 1px solid rgba(255, 215, 0, 0.1);
      animation: anillo 11s ease-in-out infinite reverse;
    }

    @keyframes nucleoPulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.07); filter: brightness(1.12); }
    }

    @keyframes anillo {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(1.09); opacity: 0.9; }
    }

    .universo {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      will-change: transform;
    }

    .orbita {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 215, 0, 0.06);
    }

    .orbita-1 { width: 250px; height: 250px; }
    .orbita-2 { width: 370px; height: 370px; }
    .orbita-3 { width: 490px; height: 490px; }

    .elemento {
      position: absolute;
    }

    /* Esta es la clave: las flores y textos siempre quedan derechos */
    .contenido {
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .flor {
      font-size: 22px;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.9));
      animation: flotar 6s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.08); }
    }

    .mensaje {
      font-size: 0.84rem;
      color: #ffe9a0;
      text-shadow: 0 0 14px rgba(255, 215, 0, 0.8);
      white-space: nowrap;
      opacity: 0;
      animation: msgIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    .mensaje.especial {
      font-size: 0.98rem;
      font-weight: 600;
      color: #fff8e1;
      text-shadow: 
        0 0 12px #ffd700,
        0 0 28px rgba(255, 180, 0, 0.7);
    }

    @keyframes msgIn {
      from { opacity: 0; transform: scale(0.4) translateY(18px); }
      to { opacity: 0.95; transform: scale(1) translateY(0); }
    }

    .instruccion {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      color: rgba(255, 230, 140, 0.55);
      text-align: center;
      z-index: 50;
      pointer-events: none;
      width: 90%;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="nebulosa"></div>

  <div class="titulo">
    <h1>Mi gogda</h1>
    <p>Flores Amarillas 💛</p>
  </div>

  <div class="nucleo"></div>

  <div class="universo" id="universo">
    <div class="orbita orbita-1" id="orbita1"></div>
    <div class="orbita orbita-2" id="orbita2"></div>
    <div class="orbita orbita-3" id="orbita3"></div>
  </div>

  <div class="instruccion">
    Desliza para girar • Pellizca para zoom
  </div>

  <script>
    function crearEstrellas() {
      for (let i = 0; i < 170; i++) {
        const e = document.createElement('div');
        e.classList.add('estrella');
        const size = Math.random() * 2.1 + 0.35;
        e.style.width = size + 'px';
        e.style.height = size + 'px';
        e.style.left = Math.random() * 100 + 'vw';
        e.style.top = Math.random() * 100 + 'vh';
        e.style.setProperty('--duracion', (1.8 + Math.random() * 4.5) + 's');
        e.style.animationDelay = Math.random() * 6 + 's';
        document.body.appendChild(e);
      }
    }

    const mensajes = [
      { t: "Flores para ti 🌻", e: true },
      { t: "Sonríe siempre", e: false },
      { t: "Siempre brillas", e: false },
      { t: "Eres mi luz", e: true },
      { t: "Te elijo cada día", e: false },
      { t: "Mi persona favorita", e: true },
      { t: "Gracias por existir", e: false },
      { t: "Contigo todo es mejor", e: false },
      { t: "Mi gogda hermosa", e: true },
      { t: "Amor eterno 💛", e: true },
      { t: "Brillas más que el sol", e: false },
      { t: "Eres mi paz", e: false },
      { t: "Mi lugar seguro", e: false },
      { t: "Te adoro", e: true },
      { t: "Mi universo", e: true }
    ];

    function llenarOrbita(id, cantidad, radio) {
      const orbita = document.getElementById(id);
      for (let i = 0; i < cantidad; i++) {
        const angulo = (i / cantidad) * Math.PI * 2;
        const x = Math.cos(angulo) * radio;
        const y = Math.sin(angulo) * radio;

        const el = document.createElement('div');
        el.classList.add('elemento');
        el.style.left = `calc(50% + ${x}px)`;
        el.style.top = `calc(50% + ${y}px)`;
        el.style.transform = 'translate(-50%, -50%)';

        // Contenedor que siempre se mantiene derecho
        const contenido = document.createElement('div');
        contenido.classList.add('contenido');

        const flor = document.createElement('div');
        flor.classList.add('flor');
        flor.textContent = '🌻';
        flor.style.fontSize = (17 + Math.random() * 11) + 'px';
        flor.style.animationDelay = Math.random() * 5 + 's';
        contenido.appendChild(flor);

        if (i % 2 === 0) {
          const msgData = mensajes[i % mensajes.length];
          const msg = document.createElement('div');
          msg.classList.add('mensaje');
          if (msgData.e) msg.classList.add('especial');
          msg.textContent = msgData.t;
          msg.style.animationDelay = (0.5 + i * 0.12) + 's';
          contenido.appendChild(msg);
        }

        el.appendChild(contenido);
        orbita.appendChild(el);
      }
    }

    // ========== CONTROL ==========
    const universo = document.getElementById('universo');
    const contenidos = () => document.querySelectorAll('.contenido');

    let rotacion = 0;
    let scale = 1;
    let inicioX = 0;
    let rotacionInicial = 0;
    let inicioScale = 1;
    let inicioDistancia = 0;
    let arrastrando = false;
    let pellizcando = false;

    function actualizar() {
      // Gira todo el universo
      universo.style.transform = `rotate(${rotacion}deg) scale(${scale})`;

      // Contra-rotación para que flores y textos siempre queden derechos
      contenidos().forEach(el => {
        el.style.transform = `rotate(${-rotacion}deg)`;
      });
    }

    // Touch
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        arrastrando = true;
        pellizcando = false;
        inicioX = e.touches[0].clientX;
        rotacionInicial = rotacion;
      } else if (e.touches.length === 2) {
        arrastrando = false;
        pellizcando = true;
        inicioScale = scale;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        inicioDistancia = Math.hypot(dx, dy);
      }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (arrastrando && e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - inicioX;
        rotacion = rotacionInicial + deltaX * 0.45;
        actualizar();
      } else if (pellizcando && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const distancia = Math.hypot(dx, dy);
        scale = Math.min(Math.max(0.4, inicioScale * (distancia / inicioDistancia)), 2.6);
        actualizar();
      }
    }, { passive: false });

    document.addEventListener('touchend', () => {
      arrastrando = false;
      pellizcando = false;
    });

    // Mouse
    let mouseAbajo = false;
    document.addEventListener('mousedown', (e) => {
      mouseAbajo = true;
      inicioX = e.clientX;
      rotacionInicial = rotacion;
    });
    document.addEventListener('mousemove', (e) => {
      if (!mouseAbajo) return;
      const deltaX = e.clientX - inicioX;
      rotacion = rotacionInicial + deltaX * 0.45;
      actualizar();
    });
    document.addEventListener('mouseup', () => mouseAbajo = false);

    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale = Math.min(Math.max(0.4, scale * (e.deltaY > 0 ? 0.9 : 1.1)), 2.6);
      actualizar();
    }, { passive: false });

    // Iniciar
    crearEstrellas();
    llenarOrbita('orbita1', 7, 115);
    llenarOrbita('orbita2', 9, 175);
    llenarOrbita('orbita3', 11, 235);
    actualizar();
  </script>
</body>
</html>
